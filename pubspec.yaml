name: kiro_time
description: A lightweight, local-first, cross-platform timetable app.
publish_to: none
version: 0.1.3+4

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  html: ^0.15.6
  flutter_riverpod: ^2.6.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.6
  webview_flutter: ^4.14.0
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1

dependency_overrides:
  isar_flutter_libs:
    path: third_party/isar_flutter_libs

flutter:
  uses-material-design: true
